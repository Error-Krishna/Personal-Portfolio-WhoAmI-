<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d13" />
      <stop offset="100%" stop-color="#161b26" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Plate -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#262d3d" stroke-width="3" />
  
  <!-- Red Terminal Prompt Symbol ">" -->
  <path d="M 28 44 L 46 64 L 28 84" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "K" Letterform in Space Mono Style -->
  <path d="M 58 38 L 58 90" fill="none" stroke="#f1f3f9" stroke-width="8" stroke-linecap="round" />
  <path d="M 88 42 L 62 66 L 92 90" fill="none" stroke="#f1f3f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Glowing Red Dot Indicator -->
  <circle cx="102" cy="88" r="4.5" fill="#dc2626" filter="url(#glow)" />
</svg>
