<header class="section-header">
  {% if eyebrow %}<p class="eyebrow section-header__eyebrow">{{ eyebrow }}</p>{% endif %}
  <h2 class="section-header__title"{% if heading_id %} id="{{ heading_id }}"{% endif %}>{{ heading }}</h2>
  {% if description %}<p class="section-header__description">{{ description }}</p>{% endif %}
</header>
