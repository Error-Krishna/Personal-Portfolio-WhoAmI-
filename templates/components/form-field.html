<div class="form-field{% if field.errors %} form-field--error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}{% if field.field.required %} <span class="form-field__required" aria-hidden="true">*</span>{% endif %}</label>
  {% if field.help_text or help_text %}<p class="form-field__help" id="{{ field.id_for_label }}-help">{{ help_text|default:field.help_text }}</p>{% endif %}
  {{ field }}
  {% if field.errors %}<ul class="form-errors" id="{{ field.id_for_label }}-errors" role="alert">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
